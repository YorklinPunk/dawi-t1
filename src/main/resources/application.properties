spring.application.name=DAWI_T1_LAZARO_YORKLIN

# Base de la API según swagger: http://localhost:8080/api/v1
server.port=8080
server.servlet.context-path=/api/v1

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bd_empleados?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql

# JPA: la tabla la crea el script.sql, Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
